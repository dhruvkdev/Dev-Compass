# SvelteKit (adapter-node) listens on PORT inside the container (default 8080 in the image).
# Published port must match what you open in the browser: http://localhost:8080
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      # adapter-node + SvelteKit CSRF: must match the URL you type in the browser (not :5173 from .env).
      ORIGIN: "http://localhost:8080"
      # Session cookies + OAuth redirects must match the same public URL as ORIGIN for Docker.
      BETTER_AUTH_URL: "http://localhost:8080"
